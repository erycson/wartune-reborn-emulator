[project]
name = "wartune-server"
version = "0.1.0"
description = "Servidor de jogo do Legend Online / Wartune (cliente Flash 7Road)"
readme = "README.md"
authors = [
    { name = "Érycson Nóbrega", email = "egdn2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "protobuf>=7.36.2",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
]

[project.scripts]
wartune-server = "wartune_server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/wartune_server/protocol/messages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/wartune_server/protocol/messages"]
