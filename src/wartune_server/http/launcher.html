<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wartune Launcher</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
<style>
  :root { --bg: #0b0e14; --card: #151a24; --fg: #e8eaf0; --muted: #8a93a6; --accent: #e0a526; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px system-ui, sans-serif; }
  main { max-width: 420px; margin: 8vh auto; padding: 0 16px; }
  form, .card { background: var(--card); padding: 24px; border-radius: 12px; }
  label { display: block; margin: 12px 0 4px; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #2a3142; background: #0f131b; color: var(--fg); }
  button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
  button.secondary { background: #2a3142; color: var(--fg); }
  #msg { min-height: 1.4em; color: #ff8080; margin-top: 12px; }
  #game { display: none; width: 100vw; height: 100vh; }
  code { word-break: break-all; color: var(--accent); }
</style>
</head>
<body>
<main id="panel">
  <h1>Wartune</h1>
  <form id="form">
    <label for="u">Usuário</label><input id="u" autocomplete="username" required>
    <label for="p">Senha</label><input id="p" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <button type="button" class="secondary" id="reg">Criar conta</button>
    <div id="msg"></div>
  </form>
  <div class="card" id="projector" hidden>
    <p>Flash Player projector: <b>File → Open</b> e cole a URL:</p>
    <p><code id="swf"></code></p>
    <button type="button" id="ruffle">Jogar no navegador (Ruffle)</button>
  </div>
</main>
<div id="game"></div>
<script>
const $ = id => document.getElementById(id);
let session = null;

async function post(path) {
  const body = new URLSearchParams({ username: $("u").value, password: $("p").value });
  const res = await fetch(path, { method: "POST", body });
  return res.json();
}

$("reg").onclick = async () => {
  const r = await post("/api/register");
  $("msg").textContent = r.ok ? "Conta criada. Agora clique em Entrar." : r.error;
};

$("form").onsubmit = async e => {
  e.preventDefault();
  const r = await post("/api/login");
  if (!r.ok) { $("msg").textContent = r.error; return; }
  session = r;
  $("form").hidden = true;
  $("projector").hidden = false;
  $("swf").textContent = r.swf_url;
};

$("ruffle").onclick = () => {
  const host = location.hostname;
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    maxExecutionDuration: 300,
    socketProxy: [host, "127.0.0.1", "localhost"].map(h => ({ host: h, port: session.socket_port, proxyUrl: `ws://${host}:${session.websocket_port}` })),
  };
  $("panel").style.display = "none";
  const game = $("game");
  game.style.display = "block";
  const player = window.RufflePlayer.newest().createPlayer();
  player.style.width = "100%"; player.style.height = "100%";
  game.appendChild(player);
  player.ruffle().load({ url: "/Loading.swf", parameters: session.flashvars, allowScriptAccess: true });
};
</script>
</body>
</html>
